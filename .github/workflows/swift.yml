# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Schemes and Destinations (debug)
        run: |
          xcodebuild -list -project "ToDo Task.xcodeproj" || true
          xcodebuild -showdestinations -project "ToDo Task.xcodeproj" -scheme "ToDo Task" || true

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project "ToDo Task.xcodeproj" \
            -scheme "ToDo Task" \
            -destination "platform=iOS Simulator,name=iPhone SE (3rd generation)"
